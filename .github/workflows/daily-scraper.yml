name: Daily Price Scraper

permissions:
  contents: write

on:
  schedule:
    - cron: '0 10 * * *'  # Horario de ejecución: 10AM UTC = 7AM ARG
  workflow_dispatch:      # Permite ejecución manual
  push:                   # Valida en el momento cambios al propio CI o a sus dependencias
    branches: [main]
    paths:
      - '.github/workflows/daily-scraper.yml'
      - 'requirements.txt'

# Evita que dos runs (p.ej. push + cron) commiteen a main al mismo tiempo
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    # Imagen fijada: ubuntu-latest puede cambiar de versión y romper `playwright install --with-deps`
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        # Solo Chromium: es el único navegador que usan los scrapers
        run: python -m playwright install --with-deps chromium

      - name: Run all supermarkets scraper
        run: python scrape_all_async_v2.py

      - name: Upload raw scrape as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: raw-scrape-${{ github.run_number }}
          path: Data/Raw/
          retention-days: 30
          if-no-files-found: ignore

      - name: Normalize product names and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python unify_product_names.py

      - name: Rebuild chatbot dataset
        run: python build_dataset.py

      - name: Commit & push generated CSVs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Data/Cleaned/*.csv Data/Used/*.csv chatbot/data/*.csv
          git commit -m "Add generated CSVs for run ${{ github.run_number }}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Fail run if Supabase upload had errors
        if: always()
        run: |
          if [ -f db_upload_errors.txt ]; then
            echo "::error::Hubo errores subiendo precios a Supabase durante este run:"
            cat db_upload_errors.txt
            exit 1
          fi
