name: Daily Price Scraper

permissions:
  contents: write

on:
  schedule:
    - cron: '0 10 * * *'  # Horario de ejecución: 10AM UTC = 7AM ARG
  workflow_dispatch:      # Permite ejecución manual

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Run all supermarkets scraper
        run: python scrape_all_async_v2.py

      - name: Upload raw scrape as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-scrape-${{ github.run_number }}
          path: Data/Raw/
          retention-days: 30
          if-no-files-found: ignore

      - name: Normalize product names and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python unify_product_names.py

      - name: Commit & push generated CSVs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Data/Cleaned/*.csv Data/Used/*.csv
          git commit -m "Add generated CSVs for run ${{ github.run_number }}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Notify by email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Price Scraper Bot
          to: ${{ secrets.MAIL_TO }}
          subject: "⚠️ Falló el scraper diario — run #${{ github.run_number }}"
          body: |
            El workflow "Daily Price Scraper" falló en el run #${{ github.run_number }}.

            Ver el log completo acá:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
